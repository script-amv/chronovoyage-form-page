<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoVoyage Temporal Booking Page</title>
</head>
<body>
  <main>

    <form action="">
      <h1>ChronoVoyage Temporal Booking Form</h1>
      <p>Book your journey through time safely and precisely with our fully validated, interactive temporal booking form</p>

      <section>
          <h2>Personal Information</h2>
          <p>Please provide your personal details below so we can safely and accurately prepare your temporal journey</p>

          <fieldset>
            <legend>Basic Details</legend>

            <input type="text" name="first-name">
            <input type="text" name="last-name">
            <input type="radio" name="gender">
            <input type="date" name="dob">
            <select name="nationality"></select>
          </fieldset>
      </section>

      <input type="submit">
    </form>

  </main>
</body>
</html>
